{% extends 'base.html' %}{% block title %}Create Profile | Fusion Core Lift{% endblock %}{% block content %}
<div class="page-heading"><p class="eyebrow text-success">YOUR STARTING POINT</p><h1>Create your fitness profile</h1><p>Use realistic values to receive a practical, general recommendation.</p></div>
<form method="post" class="form-card mt-4" novalidate><div class="row g-3">
  <div class="col-md-6"><label class="form-label" for="name">Name</label><input required class="form-control" id="name" name="name" value="{{ form.get('name', '') }}" maxlength="80"></div>
  <div class="col-md-3"><label class="form-label" for="age">Age</label><input required class="form-control" id="age" name="age" type="number" min="13" max="100" value="{{ form.get('age', '') }}"></div>
  <div class="col-md-3"><label class="form-label" for="gender">Gender</label><select required class="form-select" id="gender" name="gender"><option value="">Select</option>{% for value in ['Male', 'Female', 'Other'] %}<option {% if form.get('gender') == value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></div>
  <div class="col-md-6"><label class="form-label" for="height">Height (cm)</label><input required class="form-control" id="height" name="height" type="number" min="50" max="250" step="0.1" value="{{ form.get('height', '') }}"></div>
  <div class="col-md-6"><label class="form-label" for="weight">Weight (kg)</label><input required class="form-control" id="weight" name="weight" type="number" min="20" max="400" step="0.1" value="{{ form.get('weight', '') }}"></div>
  <div class="col-md-4"><label class="form-label" for="goal">Fitness goal</label><select required class="form-select" id="goal" name="goal"><option value="">Select</option>{% for value in ['Weight Loss', 'Muscle Gain', 'General Fitness'] %}<option {% if form.get('goal') == value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></div>
  <div class="col-md-4"><label class="form-label" for="fitness_level">Fitness level</label><select required class="form-select" id="fitness_level" name="fitness_level"><option value="">Select</option>{% for value in ['Beginner', 'Intermediate', 'Advanced'] %}<option {% if form.get('fitness_level') == value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></div>
  <div class="col-md-4"><label class="form-label" for="diet">Diet preference</label><select required class="form-select" id="diet" name="diet"><option value="">Select</option>{% for value in ['Vegetarian', 'Non-Vegetarian'] %}<option {% if form.get('diet') == value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></div>
  <div class="col-12"><label class="form-label" for="injury">Injury or limitation <span class="text-muted">(optional)</span></label><input class="form-control" id="injury" name="injury" maxlength="200" placeholder="e.g., knee discomfort, or None" value="{{ form.get('injury', '') }}"></div>
  <div class="col-12"><button class="btn btn-accent px-4" type="submit">Generate my plan</button></div>
</div></form>{% endblock %}
